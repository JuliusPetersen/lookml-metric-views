[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lookml-metric-views"
version = "0.1.0"
description = "Convert a LookML project into Databricks Unity Catalog metric views, with a field-level report of what needs a person."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Julius Petersen" }]
requires-python = ">=3.9"
dependencies = ["lkml>=1.3", "PyYAML>=6"]

[project.optional-dependencies]
dialects = ["sqlglot>=25"]
dev = ["pytest>=7", "sqlglot>=25"]

[project.scripts]
lookml-metric-views = "lookml_metric_views.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
